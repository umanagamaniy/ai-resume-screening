<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screening</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f7; padding: 20px; color: #1d1d1f; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #0071e3; margin-bottom: 8px; font-size: 28px; }
        p.subtitle { color: #6e6e73; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { font-size: 18px; margin-bottom: 16px; color: #1d1d1f; }
        select, input[type="text"], input[type="email"], input[type="file"] { width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        button { background: #0071e3; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        button:hover { background: #0077ed; }
        button:disabled { background: #86868b; cursor: not-allowed; }
        .job-item { padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .job-item:hover { background: #f0f7ff; border-color: #0071e3; }
        .job-item.selected { background: #e5f0ff; border-color: #0071e3; }
        .job-title { font-weight: 600; margin-bottom: 4px; }
        .job-meta { font-size: 12px; color: #6e6e73; }
        .score-box { display: inline-block; padding: 12px 20px; border-radius: 12px; font-size: 32px; font-weight: 700; margin-bottom: 16px; }
        .score-green { background: #d4f4dd; color: #0a7c2e; }
        .score-yellow { background: #fff4d4; color: #8a6800; }
        .score-red { background: #ffd4d4; color: #b00020; }
        .skill-tag { display: inline-block; padding: 4px 10px; border-radius: 16px; font-size: 12px; margin: 3px; }
        .skill-match { background: #d4f4dd; color: #0a7c2e; }
        .skill-miss { background: #ffd4d4; color: #b00020; }
        .loading { display: none; color: #0071e3; margin: 10px 0; }
        .loading.active { display: block; }
        .error { color: #b00020; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 AI Resume Screening</h1>
    <p class="subtitle">Upload your resume and see how it matches against a job — analyzed by Google Gemini AI.</p>

    <div class="card">
        <h2>1. Select a Job</h2>
        <button onclick="loadJobs()">Load Available Jobs</button>
        <div id="jobsList" style="margin-top:16px;"></div>
    </div>

    <div class="card">
        <h2>2. Upload Your Resume (PDF)</h2>
        <input type="text" id="candidateName" placeholder="Your Name" />
        <input type="email" id="candidateEmail" placeholder="Your Email" />
        <input type="file" id="resumeFile" accept="application/pdf" />
        <button onclick="uploadResume()">Upload Resume</button>
        <div id="uploadStatus" style="margin-top:10px;"></div>
    </div>

    <div class="card">
        <h2>3. Analyze!</h2>
        <button onclick="analyzeMatch()" id="analyzeBtn" disabled>Run AI Analysis</button>
        <div class="loading" id="loadingMsg">⏳ AI is analyzing your resume against the job... this may take 10-20 seconds.</div>
        <div id="result" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    let selectedJobId = null;
    let uploadedResumeId = null;

    async function loadJobs() {
        const response = await fetch('/api/jobs');
        const jobs = await response.json();

        const list = document.getElementById('jobsList');
        if (jobs.length === 0) {
            list.innerHTML = '<p style="color:#6e6e73;">No jobs yet. Create one via Postman first.</p>';
            return;
        }

        list.innerHTML = jobs.map(job =>
            `<div class="job-item" data-id="${job.id}" onclick="selectJob(${job.id}, this)">
                    <div class="job-title">${job.title}</div>
                    <div class="job-meta">${job.location} · ${job.experienceRequired || 'N/A'} · ${job.salaryRange || 'N/A'}</div>
                </div>`
        ).join('');
    }

    function selectJob(id, el) {
        selectedJobId = id;
        document.querySelectorAll('.job-item').forEach(item => item.classList.remove('selected'));
        el.classList.add('selected');
        checkReady();
    }

    async function uploadResume() {
        const name = document.getElementById('candidateName').value.trim();
        const email = document.getElementById('candidateEmail').value.trim();
        const fileInput = document.getElementById('resumeFile');

        if (!name || !fileInput.files.length) {
            document.getElementById('uploadStatus').innerHTML = '<span class="error">Please enter your name and pick a PDF file.</span>';
            return;
        }

        const formData = new FormData();
        formData.append('candidateName', name);
        formData.append('candidateEmail', email);
        formData.append('file', fileInput.files[0]);

        document.getElementById('uploadStatus').innerHTML = '⏳ Uploading...';

        try {
            const response = await fetch('/api/resumes/upload', { method: 'POST', body: formData });
            const data = await response.json();
            if (response.ok) {
                uploadedResumeId = data.id;
                document.getElementById('uploadStatus').innerHTML = `✅ Uploaded! Resume ID: ${data.id}`;
                checkReady();
            } else {
                document.getElementById('uploadStatus').innerHTML = `<span class="error">Upload failed: ${data.message || data}</span>`;
            }
        } catch (err) {
            document.getElementById('uploadStatus').innerHTML = `<span class="error">Error: ${err.message}</span>`;
        }
    }

    function checkReady() {
        document.getElementById('analyzeBtn').disabled = !(selectedJobId && uploadedResumeId);
    }

    async function analyzeMatch() {
        document.getElementById('loadingMsg').classList.add('active');
        document.getElementById('result').innerHTML = '';

        try {
            const response = await fetch('/api/screening/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobId: selectedJobId, resumeId: uploadedResumeId })
            });

            document.getElementById('loadingMsg').classList.remove('active');

            if (!response.ok) {
                const err = await response.text();
                document.getElementById('result').innerHTML = `<span class="error">Analysis failed: ${err}</span>`;
                return;
            }

            const data = await response.json();
            const matching = JSON.parse(data.matchingSkills || '[]');
            const missing = JSON.parse(data.missingSkills || '[]');
            const questions = JSON.parse(data.interviewQuestions || '[]');

            const scoreClass = data.matchScore >= 70 ? 'score-green' : data.matchScore >= 50 ? 'score-yellow' : 'score-red';

            document.getElementById('result').innerHTML = `
                    <div class="score-box ${scoreClass}">${data.matchScore}/100</div>
                    <h3 style="margin:16px 0 8px;">Matching Skills</h3>
                    <div>${matching.map(s => `<span class="skill-tag skill-match">${s}</span>`).join('')}</div>
                    <h3 style="margin:16px 0 8px;">Missing Skills</h3>
                    <div>${missing.map(s => `<span class="skill-tag skill-miss">${s}</span>`).join('')}</div>
                    <h3 style="margin:16px 0 8px;">AI Summary</h3>
                    <p style="line-height:1.6;">${data.aiSummary}</p>
                    <h3 style="margin:16px 0 8px;">Suggested Interview Questions</h3>
                    <ol style="padding-left:20px;line-height:1.6;">${questions.map(q => `<li>${q}</li>`).join('')}</ol>
                `;
        } catch (err) {
            document.getElementById('loadingMsg').classList.remove('active');
            document.getElementById('result').innerHTML = `<span class="error">Error: ${err.message}</span>`;
        }
    }
</script>
</body>
</html>
